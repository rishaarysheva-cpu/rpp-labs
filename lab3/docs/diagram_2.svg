aseline="middle">администрации</tspan></text><circle cx="1863.0" cy="590.0" r="23.0" fill="white" stroke="black" stroke-width="4"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#000"><tspan x="1863.0" y="630.4" dominant-baseline="middle">Передана</tspan><tspan x="1863.0" y="655.6" dominant-baseline="middle">администрации</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#000"><tspan x="995.0" y="27.5" dominant-baseline="middle">Пользование книгой · таймеры повторно устанавливаются после продления</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#000"><tspan x="450.0" y="736.1" dominant-baseline="middle">Выдача и приём книги —</tspan><tspan x="450.0" y="758.9" dominant-baseline="middle">действия на листах 1 и 4.</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#000"><tspan x="1050.0" y="1014.8" dominant-baseline="middle">T2: due_at − 2 дня. T3: 00:00 дня после due_on. T4: 00:00 даты due_on + 30 дней.</tspan><tspan x="1050.0" y="1040.0" dominant-baseline="middle">Все таймеры прерывают только задачу ожидания. T2 и T3 не завершают выдачу.</tspan><tspan x="1050.0" y="1065.2" dominant-baseline="middle">REN раскрыт на листе 3. При отказе reminded сохраняется; после продления сбрасывается. Б → лист 4.</tspan></text></svg>