43.0" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><polyline points="355.0,218 355,182.5 540,182.5" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><rect x="405.0" y="150" width="70" height="28" fill="white"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#000"><tspan x="440" y="164.0" dominant-baseline="middle">да</tspan></text><polyline points="355.0,268 355,367.5 540,367.5" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><rect x="405.0" y="336" width="70" height="28" fill="white"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#000"><tspan x="440" y="350.0" dominant-baseline="middle">нет</tspan></text><polyline points="895,182.5 1075,182.5 1075.0,218" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><polyline points="895,367.5 1075,367.5 1075.0,268" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><polyline points="1100,243.0 1280,243.0" stroke="black" stroke-width="2" fill="none"   marker-end="url(#arrow)"/><circle cx="203.0" cy="243.0" r="23.0" fill="white" stroke="black" stroke-width="2"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#000"><tspan x="203.0" y="296.0" dominant-baseline="middle">Начало REN</tspan></text><polygon points="355.0,218 380,243.0 355.0,268 330,243.0" fill="white" stroke="black" stroke-width="2"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="35" font-weight="normal" fill="#000"><tspan x="355.0" y="243.0" dominant-baseline="middle">×</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#000"><tspan x="355" y="133.0" dominant-baseline="middle">Можно</tspan><tspan x="355" y="157.0" dominant-baseline="middle">продлить?</tspan></text><rect x="540" y="130" width="355" height="105" rx="10" fill="white" stroke="black" stroke-width="2"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#000"><tspan x="717.5" y="156.1" dominant-baseline="middle">UREN Продлить на 7 дней</tspan><tspan x="717.5" y="182.5" dominant-baseline="middle">renewed = true</tspan><tspan x="717.5" y="208.89999999999998" dominant-baseline="middle">reminded = false</tspan></text><rect x="540" y="325" width="355" height="85" rx="10" fill="white" stroke="black" stroke-width="2"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#000"><tspan x="717.5" y="354.3" dominant-baseline="middle">UDEN Сообщить отказ</tspan><tspan x="717.5" y="380.7" dominant-baseline="middle">Срок и флаги сохранить</tspan></text><polygon points="1075.0,218 1100,243.0 1075.0,268 1050,243.0" fill="white" stroke="black" stroke-width="2"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="35" font-weight="normal" fill="#000"><tspan x="1075.0" y="243.0" dominant-baseline="middle">×</tspan></text><circle cx="1303.0" cy="243.0" r="23.0" fill="white" stroke="black" stroke-width="4"/><text text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#000"><tspan x="1303.0" y="296.0" dominant-baseline="middle">Конец REN</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#000"><tspan x="795.0" y="27.5" dominant-baseline="middle">Раскрытие REN · обработка одного запроса продления</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#000"><tspan x="810.0" y="504.3" dominant-baseline="middle">Условие «да»: первое продление И нет очереди И now.date() ≤ due_on.</tspan><tspan x="810.0" y="530.7" dominant-baseline="middle">Условие «нет»: отрицание условия «да». Исход выбирает xor_gateway.</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#000"><tspan x="830.0" y="645.0" dominant-baseline="middle">Запрос уже получен задачей WR1 или WR2. После конца REN управление возвращается на лист 2.</tspan></text><text text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#000"><tspan x="855.0" y="795.0" dominant-baseline="middle">Подпроцесс не меняет статус Issued. Прямой вызов renew из Overdue запрещён классом состояния.</tspan></text></svg>